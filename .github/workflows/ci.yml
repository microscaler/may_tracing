name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly soak

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: sh scripts/check-span-discipline.sh --strict src
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo build --examples --all-features
      # the ADR-0001 reproduction is probabilistic by nature; three runs per host, uncaptured so a failure shows
      # its output (on ubuntu it has exited 1 with nothing captured since September)
      - run: cargo test --all-features --test regression_adr0001 -- --nocapture
        env: { RUST_BACKTRACE: "1" }
      - run: cargo test --test regression_adr0001 -- --nocapture
      - run: cargo test --test regression_adr0001 -- --nocapture
      - run: cargo test --all-features -- --skip entered_across_yield_panics_on_registry
      - run: cargo doc --no-deps --all-features
      - run: cargo doc --no-deps

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test soak -- --ignored --nocapture
